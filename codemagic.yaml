# Codemagic: build ne-podpisanega Spare .ipa na oblaku (brez Maca)
workflows:
  spare-ipa:
    name: Spare iOS ipa
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.filipknez.spare
    scripts:
      - name: Build unsigned .ipa
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Spare.ipa Payload
      - name: Rename artifact
        script: mv ios/App/Spare.ipa $CM_BUILD_DIR/Spare-unsigned.ipa
    artifacts:
      - Spare-unsigned.ipa
